<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bazaro 2027 – Bildverwaltung</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1000px;margin:auto;padding:24px}h1{margin:0 0 6px;font-size:28px}.lead{color:#666;margin:0 0 20px}
.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin-bottom:18px}
.connect{display:grid;grid-template-columns:1fr 1fr;gap:10px}.connect .wide{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:650;margin:5px 0}input{width:100%;padding:10px;border:1px solid #bbb;border-radius:9px;font:inherit}
button,.uploadLabel{font:inherit;cursor:pointer}.primary{background:#1d1d1f;color:#fff;border:0;border-radius:9px;padding:10px 14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.uploadLabel{display:inline-block;background:#fff;border:1px solid #aaa;border-radius:9px;padding:10px 14px}.uploadLabel input{display:none}
#drop{border:2px dashed #aaa;border-radius:12px;padding:18px;text-align:center;color:#666;margin-top:12px}.drag{background:#eee}
#status{margin:14px 0;color:#555;line-height:1.4;min-height:1.4em}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{position:relative;border:2px solid transparent;background:#fff;border-radius:14px;padding:8px}.card.active{border-color:#1d1d1f}
.pic{border:0;background:none;padding:0;width:100%;cursor:pointer;text-align:left}.pic img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:9px}
.name{font-size:12px;margin-top:7px;overflow-wrap:anywhere}.check{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid #999;display:grid;place-items:center;font-weight:800;pointer-events:none}.active .check{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
.delete{width:100%;margin-top:8px;border:1px solid #ccc;background:#fff;border-radius:8px;padding:7px;color:#8a1c1c}.delete:disabled{color:#999;background:#eee;cursor:not-allowed}
.note{font-size:12px;color:#777;line-height:1.45}a{color:inherit}
@media(max-width:600px){.connect{grid-template-columns:1fr}.connect .wide{grid-column:auto}}
</style></head>
<body><main>
<h1>Bazaro 2027</h1>
<p class="lead">Bildverwaltung · <a href="index.html" target="_blank" rel="noopener">öffentliche Seite öffnen</a></p>

<section class="panel">
<div class="connect">
 <div><label>GitHub-Benutzername</label><input id="owner" value="ywww2zjr9t-ctrl" autocomplete="username"></div>
 <div><label>Repository</label><input id="repo" value="Bazaro-2027"></div>
 <div class="wide"><label>Fine-grained Token</label><input id="token" type="password" autocomplete="off"></div>
</div>
<div class="actions"><button class="primary" id="load">Bilder laden</button></div>
<p class="note">Benutzername und Repository sind für Bazaro bereits eingetragen. Aus Sicherheitsgründen wird nur der Token nicht gespeichert.</p>
</section>

<section class="panel">
<div class="actions">
 <label class="uploadLabel">＋ Bild hinzufügen<input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple></label>
</div>
<div id="drop">Oder Bilddateien hier hineinziehen</div>
</section>

<div id="status">Token einfügen und „Bilder laden“ wählen.</div>
<div id="grid" class="grid"></div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),API="https://api.github.com";
let images=[],active="bazaro-start.jpg",activeSha="";
const hdr=()=>({"Accept":"application/vnd.github+json","Authorization":"Bearer "+$("token").value.trim(),"X-GitHub-Api-Version":"2022-11-28"});
const ids=()=>({o:encodeURIComponent($("owner").value.trim()),r:encodeURIComponent($("repo").value.trim())});
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{...hdr(),...(opts.headers||{})}});if(!r.ok)throw new Error("GitHub "+r.status);return r.json()}
function esc(v){return v.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){
 try{
  $("status").textContent="Bilder werden geladen …";$("grid").innerHTML="";
  const {o,r}=ids(),root=await api(`/repos/${o}/${r}/contents`);
  images=root.filter(f=>f.type==="file"&&/\.(jpe?g|png|webp)$/i.test(f.name));
  const af=root.find(f=>f.name==="active-image.txt");
  if(af){activeSha=af.sha;const rr=await fetch(af.download_url+"?"+Date.now(),{cache:"no-store"});active=(await rr.text()).trim()||"bazaro-start.jpg";}
  render();$("status").textContent=images.length+" Bild(er) gefunden.";
 }catch(e){$("status").textContent="Verbindung fehlgeschlagen: "+e.message}
}
function render(){
 $("grid").innerHTML="";
 images.forEach(f=>{
  const card=document.createElement("div");card.className="card"+(f.name===active?" active":"");
  const pic=document.createElement("button");pic.type="button";pic.className="pic";
  pic.innerHTML=`<span class="check">${f.name===active?"✓":""}</span><img src="${f.download_url}" alt=""><div class="name">${esc(f.name)}</div>`;
  pic.addEventListener("click",()=>choose(f.name));
  const del=document.createElement("button");del.type="button";del.className="delete";del.textContent=f.name===active?"Aktives Bild":"Löschen";
  del.disabled=f.name===active;del.addEventListener("click",()=>removeImage(f));
  card.append(pic,del);$("grid").appendChild(card);
 });
}
async function choose(name){
 try{
  $("status").textContent="Auswahl wird gespeichert …";
  const {o,r}=ids(),content=btoa(unescape(encodeURIComponent(name+"\n")));
  const body={message:"Bazaro: Hintergrundbild auswählen",content};if(activeSha)body.sha=activeSha;
  const data=await api(`/repos/${o}/${r}/contents/active-image.txt`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  activeSha=data.content.sha;active=name;render();
  $("status").textContent="✓ Bild ausgewählt. GitHub Pages veröffentlicht die Änderung automatisch.";
 }catch(e){$("status").textContent="Speichern fehlgeschlagen: "+e.message}
}
async function uploadFiles(list){
 const files=[...list].filter(f=>/^image\/(jpeg|png|webp)$/.test(f.type));
 if(!files.length)return;
 for(const f of files){
  try{
   $("status").textContent="Lade "+f.name+" hoch …";
   const buf=await f.arrayBuffer(),bytes=new Uint8Array(buf);let bin="";
   const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode(...bytes.subarray(i,i+chunk));
   const content=btoa(bin),{o,r}=ids(),path=encodeURIComponent(f.name);
   let sha;try{const old=await api(`/repos/${o}/${r}/contents/${path}`);sha=old.sha}catch(e){}
   const body={message:"Bazaro: Bild hochladen "+f.name,content};if(sha)body.sha=sha;
   await api(`/repos/${o}/${r}/contents/${path}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  }catch(e){$("status").textContent="Upload fehlgeschlagen bei "+f.name+": "+e.message;return}
 }
 await load();$("status").textContent="✓ Bild(er) hochgeladen.";
}
async function removeImage(f){
 if(f.name===active)return;
 if(!confirm("„"+f.name+"“ wirklich löschen?"))return;
 try{
  $("status").textContent="Lösche "+f.name+" …";const {o,r}=ids(),path=encodeURIComponent(f.name);
  await api(`/repos/${o}/${r}/contents/${path}`,{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:"Bazaro: Bild löschen "+f.name,sha:f.sha})});
  await load();$("status").textContent="✓ Bild gelöscht.";
 }catch(e){$("status").textContent="Löschen fehlgeschlagen: "+e.message}
}
$("load").addEventListener("click",load);
$("file").addEventListener("change",e=>uploadFiles(e.target.files));
const drop=$("drop");
drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("drag")});
drop.addEventListener("dragleave",()=>drop.classList.remove("drag"));
drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("drag");uploadFiles(e.dataTransfer.files)});
})();
</script>
</body></html>
