<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Bazaro 2027</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
.stage{
 position:fixed;
 left:50%;top:50%;
 width:min(100vw,56.28vh);
 height:min(177.68vw,100vh);
 transform:translate(-50%,-50%);
 overflow:hidden;
}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}

/* WiDo-Prinzip: Position bleibt ausschließlich prozentual auf dem Foto. */
.countdown{
 position:absolute;
 left:57.0%;
 top:56.8%;
 transform:
   translate(-50%,-50%)
   perspective(900px)
   rotateX(74deg)
   rotateZ(3deg);
 transform-origin:center center;
 color:rgba(62,62,62,.78);
 font-family:"Arial Narrow","Helvetica Neue Condensed","Helvetica Neue",Arial,sans-serif;
 text-align:center;
 white-space:nowrap;
 line-height:1;
}
.countdown .noch{
 display:block;
 font-size:calc(min(100vw,56.28vh)*.078);
 font-weight:650;
 letter-spacing:.025em;
 line-height:1.05;
 margin-bottom:.34em;
}
.countdown .zahl{
 display:block;
 font-size:calc(min(100vw,56.28vh)*.263);
 font-weight:850;
 letter-spacing:-.045em;
 font-variant-numeric:tabular-nums;
 line-height:.76;
 margin:.10em 0 .34em;
}
.countdown .tage{
 display:block;
 font-size:calc(min(100vw,56.28vh)*.084);
 font-weight:650;
 letter-spacing:.02em;
 line-height:1.05;
}
#error{position:absolute;inset:0;display:grid;place-items:center;padding:2rem;color:white;font:16px/1.4 sans-serif;text-align:center}
</style>
</head>
<body>
<main class="stage" aria-label="Bazaro 2027 Countdown">
 <img class="photo" id="photo" alt="Bazaro 2027">
 <div class="countdown" aria-live="polite">
   <span class="noch">noch</span>
   <span class="zahl" id="days">…</span>
   <span class="tage">Tage</span>
 </div>
 <div id="error" hidden></div>
</main>

<script>
const TARGET=new Date("2027-09-17T00:00:00+02:00");

function update(){
 const d=TARGET.getTime()-Date.now();
 const days=d<=0?0:Math.ceil(d/86400000);
 document.getElementById("days").textContent=days.toLocaleString("de-DE");
}
update();
setInterval(update,30000);

/* Genau ein frei benanntes Bild im Repository; der Dateiname ist egal. */
(async()=>{
 const photo=document.getElementById("photo");
 const error=document.getElementById("error");
 try{
   const owner=location.hostname.split(".")[0];
   const repo=location.pathname.split("/").filter(Boolean)[0];
   const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents`,{cache:"no-store"});
   if(!r.ok) throw new Error("Bild konnte nicht ermittelt werden.");
   const files=await r.json();
   const images=files.filter(f=>f.type==="file"&&/\.(jpe?g|png|webp)$/i.test(f.name));
   if(images.length!==1) throw new Error(images.length===0 ? "Kein Bild gefunden." : "Bitte genau ein Bild im Repository lassen.");
   photo.src=images[0].download_url+"?v="+Date.now();
 }catch(e){
   photo.style.display="none";
   document.querySelector(".countdown").style.display="none";
   error.hidden=false;
   error.textContent=e.message;
 }
})();
</script>
</body>
</html>
